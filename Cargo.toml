[workspace]
resolver = "2"
members = [
    "crates/jev-quantum-core",
    "crates/jev-quantum-server",
    "crates/jev-quantum-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Jev Quantum"]
description = "The sub-microsecond System -1 decision engine with Gaussian-distributed accuracy."

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
dotenvy = "0.15"
http-body-util = "0.1"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
